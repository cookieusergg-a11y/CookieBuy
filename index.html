<script>
// ======== FIREBASE ========
const firebaseConfig = {
    apiKey: "AIzaSyDmc0XX2EDzF5Gfyqvf7ZgjzoumRFju1r4",
    authDomain: "cookiebuystore.firebaseapp.com",

    projectId: "cookiebuystore",

    appId: "1:440299097748:web:2efebb13587f41115c6e81",
    measurementId: "G-X225TW7NHV"
};

try {
    firebase.initializeApp(firebaseConfig);
    console.log("✅ Firebase initialized");
} catch(e) {
    console.error("❌ Firebase init error:", e);
    alert("Ошибка инициализации Firebase: " + e.message);
}

const auth = firebase.auth();
const db = firebase.database();

// ======== КОНСТАНТЫ ========
const ADMIN_EMAIL = "cookieusergg@gmail.com";
const BOT_URL = "https://t.me/cookiebuy_RUbot";

let currentUser = null;
let products = [];
let inventory = [];
let filteredProducts = [];
let userBalance = 0;
let isAdmin = false;
let productCache = { byPrice: {}, byLoot: {}, byType: {} };
let currentTgKey = null;
let inventoryListener = null;

// ======== АВТОРИЗАЦИЯ (без изменений) ========
// ... (функции loginWithGoogle, loginWithTG, logout, checkAdmin, auth.onAuthStateChanged — такие же как в предыдущем коде)

// ======== ЗАГРУЗКА ДАННЫХ ========
function loadData() {
    if (!currentUser) {
        console.warn("loadData: нет currentUser");
        return;
    }
    console.log("loadData: загружаем данные для", currentUser.uid);

    // Подписываемся на товары
    db.ref('products').on('value', snap => {
        products = [];
        snap.forEach(child => { products.push({ id: child.key, ...child.val() }); });
        buildProductCache();
        filteredProducts = products;
        renderProducts();
        console.log("Товаров загружено:", products.length);
    });

    // Отписываемся от старого слушателя, чтобы избежать дублирования
    if (inventoryListener) {
        inventoryListener.off();
        inventoryListener = null;
    }

    // Подписываемся на инвентарь
    const invRef = db.ref(`users/${currentUser.uid}/inventory`);
    inventoryListener = invRef.on('value', snap => {
        inventory = [];
        snap.forEach(child => {
            inventory.push({ id: child.key, ...child.val() });
        });
        renderInventory();
        document.getElementById('invCount').textContent = inventory.length;
        console.log("Инвентарь загружен, позиций:", inventory.length);
    }, error => {
        console.error("Ошибка загрузки инвентаря:", error);
        document.getElementById('inventoryGrid').innerHTML = `<div style="color:#d96c6c;">❌ Ошибка загрузки инвентаря: ${error.message}</div>`;
    });

    // Подписываемся на баланс
    db.ref(`users/${currentUser.uid}/balance`).on('value', snap => {
        userBalance = snap.val() || 0;
        document.getElementById('userBalance').textContent = userBalance.toFixed(2);
        console.log("Баланс обновлён:", userBalance);
    });
}

// ======== ПОКУПКА (с обработкой ошибок) ========
function buyProduct(productId) {
    if (!currentUser) {
        showToast('❌ Авторизуйтесь!');
        return;
    }
    const product = products.find(p => p.id === productId);
    if (!product) {
        showToast('❌ Товар не найден');
        return;
    }
    if (userBalance < product.price) {
        showToast(`❌ Недостаточно средств. Нужно ${product.price.toFixed(2)} USDT, у вас ${userBalance.toFixed(2)} USDT`);
        return;
    }

    // Блокируем кнопку, чтобы не было двойного клика
    const btn = event && event.target ? event.target : document.querySelector(`.btn-buy[data-id="${productId}"]`);
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Обработка...'; }

    // Сначала списываем баланс
    const newBalance = userBalance - product.price;
    db.ref(`users/${currentUser.uid}/balance`).set(newBalance)
    .then(() => {
        // Баланс обновился, теперь добавляем в инвентарь
        const invItem = {
            ...product,
            purchasedAt: Date.now(),
            status: product.type === 'tg' ? 'waiting_code' : 'active',
            owner: currentUser.uid,
            price_paid: product.price,
            transaction_id: 'instant_' + Date.now()
        };
        return db.ref(`users/${currentUser.uid}/inventory`).push(invItem);
    })
    .then((ref) => {
        // Удаляем из продажи
        return db.ref(`products/${productId}`).remove();
    })
    .then(() => {
        showToast(`✅ Товар куплен за ${product.price.toFixed(2)} USDT!`);
        // Принудительно обновляем инвентарь (слушатель сам сработает, но на всякий случай)
        // Можно вызвать loadData(), но слушатель уже есть.
        // Также разблокируем кнопку
        if (btn) { btn.disabled = false; btn.textContent = 'Купить'; }
    })
    .catch((error) => {
        console.error("Ошибка при покупке:", error);
        showToast(`❌ Ошибка покупки: ${error.message}`);
        // Возвращаем баланс обратно при ошибке
        db.ref(`users/${currentUser.uid}/balance`).set(userBalance);
        if (btn) { btn.disabled = false; btn.textContent = 'Купить'; }
    });
}

// ======== РЕНДЕРИНГ ИНВЕНТАРЯ (с индикацией загрузки) ========
function renderInventory() {
    const grid = document.getElementById('inventoryGrid');
    if (!grid) return;
    if (inventory === null) {
        grid.innerHTML = '<div style="color:#5d6480;padding:40px 0;text-align:center;"><span class="loading-spinner"></span> Загрузка инвентаря...</div>';
        return;
    }
    if (inventory.length === 0) {
        grid.innerHTML = '<div style="color:#5d6480;padding:40px 0;text-align:center;">📭 Инвентарь пуст</div>';
        return;
    }
    grid.innerHTML = inventory.map(item => {
        const statusMap = { 'active': '✅ Активен', 'used': '❌ Использован', 'waiting_code': '⏳ Ожидает код' };
        return `
        <div class="inv-card">
            <div class="type">${item.type === 'cookie' ? '🍪 COOKIE' : '✈️ TELEGRAM'}</div>
            <div style="font-family:monospace;font-size:13px;background:#0b0e18;padding:8px 12px;border-radius:12px;margin:10px 0;word-break:break-all;">${item.data}</div>
            <div>💰 ${(item.price_paid || item.price).toFixed(1)} USDT</div>
            <div class="status ${item.status}">${statusMap[item.status] || item.status}</div>
            <button class="btn-get" onclick="getProduct('${item.id}')" ${item.status === 'used' ? 'disabled' : ''}>
                ${item.status === 'active' ? '📦 Получить' : item.status === 'waiting_code' ? '📱 Получить код' : '🔒 Использован'}
            </button>
        </div>
    `}).join('');
}
